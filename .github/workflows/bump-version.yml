name: Bump Plugin Version

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: bump
        run: |
          CURRENT_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)

          LAST_BUMP=$(git log --format="%H %s" | grep "^.\{40\} chore: bump version" | head -1 | awk '{print $1}')

          if [ -z "$LAST_BUMP" ]; then
            COMMITS=$(git log --format="%s")
          else
            COMMITS=$(git log --format="%s" "${LAST_BUMP}..HEAD")
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits to process, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP_TYPE="patch"

          while IFS= read -r msg; do
            if echo "$msg" | grep -qE "^[a-z]+(\(.+\))?!:"; then
              BUMP_TYPE="major"
              break
            fi
            if echo "$msg" | grep -qE "^BREAKING CHANGE:"; then
              BUMP_TYPE="major"
              break
            fi
            if echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
              [ "$BUMP_TYPE" != "major" ] && BUMP_TYPE="minor"
            fi
          done <<< "$COMMITS"

          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update plugin.json
        if: steps.bump.outputs.skip != 'true'
        run: |
          jq --arg v "${{ steps.bump.outputs.new_version }}" '.version = $v' \
            .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json

      - name: Commit and push
        if: steps.bump.outputs.skip != 'true'
        run: |
          git add .claude-plugin/plugin.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push
